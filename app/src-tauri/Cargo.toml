[package]
name = "geopulse-desktop"
version = "0.0.0" # the app version comes from app/package.json (tauri.conf.json)
description = "GeoPulse desktop: Earth-change maps computed on this PC"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "geopulse_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1" # tauri::generate_context! embeds the plugins' config as JSON
getrandom = "0.3"

# Small binary: the shell only hosts the web app and supervises the Python engine.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
