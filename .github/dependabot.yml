version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # torch comes from the PyTorch CUDA index, which lags PyPI; bump it by hand with `uv lock --upgrade-package torch`
      - dependency-name: torch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
