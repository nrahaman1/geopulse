name: Pages

# The web app on GitHub Pages: static files; every job runs in the visitor's browser.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: ONNX models for the in-browser engine (from the models release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download models-v1 -R "$GITHUB_REPOSITORY" -p "*.onnx" -p index.json -D models
      - run: npm ci && npm run build
        working-directory: app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
      - id: deploy
        uses: actions/deploy-pages@v4
