name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check geopulse tests hatch_build.py
      - run: uvx ruff format --check geopulse tests hatch_build.py
      - name: Lockfile matches pyproject.toml
        run: uv lock --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install with CPU PyTorch
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . pytest httpx onnx onnxruntime
      - name: "Tests (offline; includes the browser engine vs Python under Node.js)"
        run: uv run --no-sync pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Build has the app shell, service worker and examples
        run: test -f app/dist/index.html && test -f app/dist/sw.js && grep -q flood_emilia_conselice app/dist/examples.json
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Wheel ships the web app and example events
        run: |
          python3 -m zipfile -l dist/*.whl > wheel.txt
          grep -q "geopulse/ui/index.html" wheel.txt
          grep -q "geopulse/examples/flood_emilia_conselice/request.yaml" wheel.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci && npm run build && npm run uv -- x86_64-unknown-linux-gnu
        working-directory: app
      - name: Desktop app compiles (Tauri)
        run: cargo check --locked
        working-directory: app/src-tauri
