[project]
name = "geopulse-eo"  # "geopulse" on PyPI is an unrelated project; the import name stays `geopulse`
dynamic = ["version"]
description = "Open-source multimodal geospatial AI for Earth-change intelligence: flood, wildfire and vegetation disturbance from Sentinel-1/2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nafiz Rahaman" }]
requires-python = ">=3.11"
keywords = [
    "remote-sensing", "earth-observation", "sentinel-1", "sentinel-2", "sar", "change-detection",
    "flood-mapping", "wildfire", "burn-severity", "deforestation", "stac", "geospatial", "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.4",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "pyyaml>=6",
    "torch>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface-hub>=0.23",
]

[project.urls]
Homepage = "https://github.com/nrahaman1/geopulse"
Repository = "https://github.com/nrahaman1/geopulse"
Issues = "https://github.com/nrahaman1/geopulse/issues"
Changelog = "https://github.com/nrahaman1/geopulse/blob/main/CHANGELOG.md"
Models = "https://huggingface.co/nafizrahaman/geopulse-gpft-mini"

[project.scripts]
geopulse = "geopulse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3"]

# Windows wheels on PyPI are CPU-only, so Windows gets the CUDA 12.8 build; Linux wheels on PyPI already ship CUDA,
# macOS uses PyPI (CPU/MPS). CPU-only Linux: `uv pip install torch --index-url https://download.pytorch.org/whl/cpu`.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "geopulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geopulse"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "geopulse/examples"  # so `pip install` users get the example events in the API and web map

[tool.hatch.build.targets.sdist]
include = [
    "geopulse", "tests", "examples", "configs", "docs", "README.md", "CHANGELOG.md", "CONTRIBUTING.md",
    "MODEL_CARD.md", "DATA_LICENSES.md", "THIRD_PARTY_NOTICES.md", "ROADMAP.md", "LICENSE", "NOTICE", "CITATION.cff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
