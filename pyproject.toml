[project]
name = "geopulse-eo"  # "geopulse" on PyPI is an unrelated project; the import name stays `geopulse`
dynamic = ["version"]
description = "Open-source multimodal geospatial AI for Earth-change intelligence: flood, wildfire and vegetation disturbance from Sentinel-1/2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nafiz Rahaman" }]
requires-python = ">=3.11"
keywords = [
    "remote-sensing", "earth-observation", "sentinel-1", "sentinel-2", "sar", "change-detection",
    "flood-mapping", "wildfire", "burn-severity", "deforestation", "stac", "geospatial", "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.4",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "pyyaml>=6",
    "torch>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# Which PyTorch build to install. Plain `pip install` / `uv sync` get PyPI's (CUDA on Linux, CPU on Windows,
# Metal on macOS); `uv sync --extra gpu` adds CUDA on Windows too, `--extra cpu` keeps Windows/Linux small. The
# desktop app picks `gpu` when it finds an NVIDIA GPU, else `cpu`.
[project.optional-dependencies]
gpu = ["torch>=2.4"]
cpu = ["torch>=2.4"]

[project.urls]
Homepage = "https://github.com/nrahaman1/geopulse"
Repository = "https://github.com/nrahaman1/geopulse"
Issues = "https://github.com/nrahaman1/geopulse/issues"
Changelog = "https://github.com/nrahaman1/geopulse/blob/main/CHANGELOG.md"
Platform = "https://nrahaman1.github.io/geopulse/"
Downloads = "https://github.com/nrahaman1/geopulse/releases"

[project.scripts]
geopulse = "geopulse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'win32'" },  # PyPI's Windows wheels are CPU-only
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },  # PyPI's Linux wheels bundle CUDA
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "geopulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geopulse"]

[tool.hatch.build.targets.wheel.hooks.custom]  # hatch_build.py: adds the built web app and the example events

[tool.hatch.build.targets.sdist]
include = [
    "geopulse", "tests", "examples", "configs", "docs", "hatch_build.py", "README.md", "CHANGELOG.md", "CONTRIBUTING.md",
    "MODEL_CARD.md", "DATA_LICENSES.md", "THIRD_PARTY_NOTICES.md", "ROADMAP.md", "LICENSE", "NOTICE", "CITATION.cff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
