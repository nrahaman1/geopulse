# Ablation: identical to vegetation_gpft.yaml without sensor dropout (RQ3 on a second task).
name: gpft-vegetation-mini-nodrop
version: 0.1.0
dataset: data/bench/geopulse-bench-vegetation
seed: 42
model: {channels: 32, dropout: 0.1}
train: {epochs: 40, batch_size: 8, lr: 0.002, weight_decay: 0.0001}
loss: {change_weight: 0.5}
sensor_dropout: {}
