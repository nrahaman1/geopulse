# Ablation: identical to flood_gpft.yaml but without sensor dropout (RQ3: does dropout reduce degradation?).
name: gpft-flood-mini-nodrop
version: 0.1.0
dataset: data/bench/geopulse-bench-flood
seed: 42
model: {channels: 32, dropout: 0.1}
train: {epochs: 40, batch_size: 8, lr: 0.002, weight_decay: 0.0001}
loss: {change_weight: 0.5}
sensor_dropout: {}
